# Copie para .streamlit/secrets.toml (ou cadastre no painel do host). NUNCA suba este arquivo preenchido para o GitHub.

# Administrador inicial (e-mail da conta Microsoft de quem vai configurar o portal)
[portal]
admin_email = "seu.email@isssl.com.br"
# Senha do administrador inicial (primeiro acesso, login manual). Troque em Permissionamento e depois apague esta linha.
admin_password = "defina-uma-senha-forte"
# Login por e-mail e senha (usuários criados em Permissionamento). Padrão ligado; "0" desliga quando só Microsoft.
password_login = "1"
# Onde guardar usuários, perfis, unidades, conexões e plano de ação:
# "sqlite" = arquivo portal.db na pasta de dados (padrão; formato pedido pela TI; precisa de disco persistente),
# "json" = arquivo local (teste), "sheets" = planilha do Google (use no Streamlit Cloud, que apaga arquivos ao reiniciar).
config_backend = "sqlite"
config_sheet = ""   # URL ou ID da planilha "Portal_Config" (quando config_backend = "sheets")

# Conta de serviço do Google (a mesma usada hoje nos formulários)
[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
token_uri = "https://oauth2.googleapis.com/token"

